            color: #555;

        }

            width: 100%;
            text-align: left;
            background: #f5f5f5;
            color: #333;
            border: 2px solid transparent;
        }

            border-color: #667eea;
        }

            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

            border-color: #dc3545;

    }

];


/* =========================================================
   SHUFFLE FUNCTION
   ========================================================= */

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }

}


/* =========================================================
   START QUIZ
   ========================================================= */

function startQuiz() {

    currentQuestion = 0;
    score = 0;

    questions = [...questionBank];

    shuffle(questions);

    questions = questions.slice(0, QUESTIONS_PER_QUIZ);

    document.getElementById("welcome-screen").classList.add("hidden");

    document.getElementById("result-screen").classList.add("hidden");

    document.getElementById("quiz-screen").classList.remove("hidden");

    showQuestion();
}


/* =========================================================
   SHOW QUESTION
   ========================================================= */

function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("question-number").innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("score-display").innerText =
        `Score: ${score}`;

    document.getElementById("category").innerText =
        `${q.category} • ${q.type || "Concept"}`;

    document.getElementById("question").innerText = q.question;

    const progress =
        ((currentQuestion + 1) / questions.length) * 100;

    document.getElementById("progress-bar").style.width =
        progress + "%";

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.classList.add("option");

        button.innerText = option;

        button.onclick = () => selectAnswer(index);

        optionsContainer.appendChild(button);

    });

    const nextButton =
        document.getElementById("next-btn");

    if (currentQuestion === questions.length - 1) {

        nextButton.innerText = "Finish Quiz";

    } else {

        nextButton.innerText = "Next Question";

    }

}


/* =========================================================
   SELECT ANSWER
   ========================================================= */

function selectAnswer(selectedIndex) {

    const q = questions[currentQuestion];

    const optionButtons =
        document.querySelectorAll(".option");

    optionButtons.forEach(button => {
        button.disabled = true;
    });

    if (selectedIndex === q.answer) {

        optionButtons[selectedIndex]
            .classList.add("correct");

        score++;

        document.getElementById("score-display").innerText =
            `Score: ${score}`;

    } else {

        optionButtons[selectedIndex]
            .classList.add("wrong");

        optionButtons[q.answer]
            .classList.add("correct");

    }

}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

    const optionButtons =
        document.querySelectorAll(".option");

    let answered = false;

    optionButtons.forEach(button => {

        if (button.disabled) {
            answered = true;
        }

    });

    if (!answered) {

        alert("Please select an answer first.");

        return;

    }

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }

}


/* =========================================================
   SHOW RESULT
   ========================================================= */

function showResult() {

    document.getElementById("quiz-screen")
        .classList.add("hidden");

    document.getElementById("result-screen")
        .classList.remove("hidden");

    const total = questions.length;

    const percentage =
        Math.round((score / total) * 100);

    document.getElementById("final-score").innerText =
        `${score} / ${total}`;

    document.getElementById("percentage").innerText =
        `${percentage}%`;

    let message;

    if (percentage === 100) {

        message = "🏆 Perfect Score! Excellent work!";

    } else if (percentage >= 80) {

        message = "🌟 Excellent! You have strong web development knowledge.";

    } else if (percentage >= 60) {

        message = "👍 Good job! Keep practicing.";

    } else if (percentage >= 40) {

        message = "📚 Nice attempt! More practice will help.";

    } else {

        message = "💪 Keep learning and try again!";

    }

    document.getElementById("message").innerText =
        message;

}


/* =========================================================
   RESTART QUIZ
   ========================================================= */

function restartQuiz() {

    document.getElementById("result-screen")
        .classList.add("hidden");

    document.getElementById("welcome-screen")
        .classList.remove("hidden");

}


/* =========================================================
   SHARE QUIZ
   ========================================================= */

function shareQuiz() {

    const shareData = {

        title: "HTML CSS JavaScript Quiz",

        text: "Try this HTML, CSS and JavaScript quiz!",

        url: window.location.href

    };

    if (navigator.share) {

        navigator.share(shareData);

    } else {

        copyLink();

        alert("Quiz link copied! You can share it with your friends.");

    }

}


/* =========================================================
   COPY LINK
   ========================================================= */

function copyLink() {

    const url = window.location.href;

    navigator.clipboard.writeText(url)
        .then(() => {

            alert("Quiz link copied to clipboard!");

        })
        .catch(() => {

            prompt("Copy this quiz link:", url);

        });

}
